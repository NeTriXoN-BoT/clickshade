name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and platform
      description: Include interactions with cursor restoration, game rules, resource use, and existing settings where relevant.
    validations:
      required: true
