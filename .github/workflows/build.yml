name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Ref to build for a draft release
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure
        run: cmake -S . -B build -A x64 -DCLICKSHADE_BUILD_TESTS=ON
      - name: Compile
        run: cmake --build build --config Release --parallel
      # Every headless suite registered with add_test runs here, so a new test
      # needs no edit to this file. The interactive cursor, runtime and visual
      # suites stay unregistered.
      - name: Headless decoder, settings and layout checks
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Stage compiled files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/Release/*.exe stage/
          git rev-parse HEAD | Set-Content -Encoding ascii stage/BUILD-REVISION.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: stage/*
          if-no-files-found: error
      # Cursor/runtime/overlay checks require an interactive acceptance desktop.
      # Do not turn a hosted build into a claim of game/compositor validation.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config dbus-daemon libgtk-3-dev libpulse-dev libx11-dev libxi-dev libxfixes-dev libxrender-dev libxext-dev libxrandr-dev libxcursor-dev libcairo2-dev libxtst-dev
      - name: Configure and build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLICKSHADE_BUILD_TESTS=ON
          cmake --build build-linux --parallel
      - name: Headless settings and extension logic checks
        run: |
          ctest --test-dir build-linux --output-on-failure --no-tests=error
          node linux/gnome-extension/tests.mjs
          node --check linux/gnome-extension/extension.js
          sh -n linux/gnome-extension/install.sh
      - name: Stage compiled files
        run: |
          mkdir -p stage
          cp build-linux/ClickShade stage/ClickShade
          cp build-linux/linux/ClickShadeX11Test stage/x11_smoke
          git rev-parse HEAD > stage/BUILD-REVISION.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: stage/*
          if-no-files-found: error
