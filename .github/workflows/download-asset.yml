name: Update download asset
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave blank for the latest stable release)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: download-asset-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false
jobs:
  download-asset:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Attach stable download filename
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          versioned_name="ClickShade-${RELEASE_TAG#v}-Windows-Linux.zip"
          stable_name="ClickShade-Windows-Linux.zip"
          mkdir -p download
          gh release download "$RELEASE_TAG" --pattern "$versioned_name" --dir download
          cp "download/$versioned_name" "download/$stable_name"
          gh release upload "$RELEASE_TAG" "download/$stable_name" --clobber
